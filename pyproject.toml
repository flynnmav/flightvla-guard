[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightvla-guard"
version = "0.1.0"
description = "Safety gateway + evaluation platform that lets any VLA / VLM / LLM flight agent safely drive PX4 drones"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "FlightVLA Guard contributors" }]
keywords = ["px4", "vla", "vlm", "llm", "drone", "safety", "offboard", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Robotics",
]

[project.scripts]
flightvla = "flightvla.cli:main"

[tool.setuptools.packages.find]
include = ["flightvla*"]
